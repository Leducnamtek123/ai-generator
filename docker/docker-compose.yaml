services:
  api:
    container_name: ai-generator-api
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - APP_MODE=api
      - ACCESS_KEY_ID=${ACCESS_KEY_ID:-minioadmin}
      - SECRET_ACCESS_KEY=${SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      - postgres
      - redis
      - minio
      - comfyui
    ports:
      - "8000:8000"
    volumes:
      - ./comfyui-workflows:/workspace/comfyui-workflows:ro


  worker:
    container_name: ai-generator-worker
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - APP_MODE=worker
      - ACCESS_KEY_ID=${ACCESS_KEY_ID:-minioadmin}
      - SECRET_ACCESS_KEY=${SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      - postgres
      - redis
      - minio
      - comfyui
    volumes:
      - ./comfyui-workflows:/workspace/comfyui-workflows:ro

  worker_beat:
    container_name: ai-generator-worker-beat
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_NAME=${DATABASE_NAME:-paintai}
      - WORKER_HOST=${WORKER_HOST:-redis://redis:6379/1}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - APP_MODE=worker_beat
    depends_on:
      - postgres
      - redis

  web:
    container_name: ai-generator-web
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_GITHUB_URL=${NEXT_PUBLIC_GITHUB_URL:-https://github.com/omergulcicek/nizam}
        - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
      - AUTH_URL=${AUTH_URL:-http://localhost}
      - API_BACKEND_URL=${API_BACKEND_URL:-http://api:8000/api/v1}
      - BILLING_API_URL=${BILLING_API_URL:-http://billing-service:8001/api/v1}
      - GENERATION_API_URL=${GENERATION_API_URL:-http://generation-service:8002/api/v1}
    depends_on:
      - api
      - billing-service
      - generation-service

  landing:
    container_name: ai-generator-landing
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_GITHUB_URL=${NEXT_PUBLIC_GITHUB_URL:-https://github.com/omergulcicek/nizam}
        - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    restart: unless-stopped

  mcp:
    container_name: ai-generator-mcp
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      - API_BASE_URL=http://api:8000/api/v1
      - API_KEY=${MCP_API_KEY}
    depends_on:
      - api

  comfyui:
    container_name: ai-generator-comfyui
    image: ghcr.io/lecode-official/comfyui-docker:latest
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - COMFYUI_PORT_HOST=8188
      - COMFYUI_ARGS=--listen --port 8188
    ports:
      - "8188:8188"
    gpus: all
    volumes:
      - ./comfyui/models:/opt/comfyui/models
      - ./comfyui/custom_nodes:/opt/comfyui/custom_nodes
      - ./comfyui/manager:/opt/comfyui-manager
      - ./comfyui/output:/opt/comfyui/output

  maildev:
    container_name: ai-generator-maildev
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "1080:1080"

  sandbox:
    container_name: ai-generator-sandbox
    image: alpine:3.20
    command: ["sh", "-c", "sleep infinity"]

  ssrf_proxy:
    container_name: ai-generator-ssrf-proxy
    image: ubuntu/squid:6.6-24.04_edge

  plugin_daemon:
    container_name: ai-generator-plugin-daemon
    image: alpine:3.20
    command: ["sh", "-c", "sleep infinity"]

  billing-service:
    container_name: ai-generator-billing-service
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_NAME=${DATABASE_NAME:-paintai}
      - WORKER_HOST=${WORKER_HOST:-redis://redis:6379/1}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-http://minio:9000}
      - APP_MODE=billing
      - APP_PORT=8001
    command: ["node", "dist/main.billing.js"]
    depends_on:
      - postgres
      - redis

  generation-service:
    container_name: ai-generator-generation-service
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_NAME=${DATABASE_NAME:-paintai}
      - WORKER_HOST=${WORKER_HOST:-redis://redis:6379/1}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-http://minio:9000}
      - APP_MODE=generation
      - APP_PORT=8002
      - BILLING_SERVICE_URL=${BILLING_SERVICE_URL:-http://billing-service:8001/api/v1}
    command: ["node", "dist/main.generation.js"]
    depends_on:
      - postgres
      - redis
      - billing-service

  postgres:
    container_name: ai-generator-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - POSTGRES_DB=${DATABASE_NAME:-paintai}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: ai-generator-redis
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    container_name: ai-generator-minio
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc
    container_name: ai-generator-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin};
      /usr/bin/mc mb myminio/${AWS_S3_BUCKET:-ai-generator} || true;
      /usr/bin/mc anonymous set public myminio/${AWS_S3_BUCKET:-ai-generator};
      exit 0;
      "

  nginx:
    container_name: ai-generator-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  minio_data:
